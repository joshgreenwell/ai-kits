[workspace]
resolver = "3"
members = [
  "crates/observatory",
  "crates/observatory-contract",
  "crates/observatory-core",
  "crates/observatory-adapters",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"
repository = "https://github.com/joshgreenwell/ai-kits"
publish = false

[workspace.dependencies]
observatory-contract = { path = "crates/observatory-contract" }
observatory-core = { path = "crates/observatory-core", default-features = false }
observatory-adapters = { path = "crates/observatory-adapters" }

clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
jiff = { version = "0.2", features = ["std"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "v5"] }
plist = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# Development only.
jsonschema = { version = "0.56", default-features = false }
insta = { version = "1", features = ["json"] }
tempfile = "3"

# Windows only: file identity (volume serial + file index) without unsafe code of our own.
winapi-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

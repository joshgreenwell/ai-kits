[package]
name = "observatory"
description = "Personal Observatory companion: collects AI usage on one machine and publishes it to the Observatory"
homepage = "https://github.com/joshgreenwell/ai-kits/tree/main/kit-board/companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "observatory"
path = "src/main.rs"

[features]
default = ["platform-tls"]
platform-tls = ["observatory-core/platform-tls"]

[lints]
workspace = true

[dependencies]
observatory-contract.workspace = true
observatory-core.workspace = true
observatory-adapters.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.dist]
dist = true

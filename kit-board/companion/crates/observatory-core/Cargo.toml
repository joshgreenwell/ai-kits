[package]
name = "observatory-core"
description = "Configuration, settings, state, sink, outbox, HTTP, locking, and service management for the Personal Observatory companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["platform-tls"]
# Verify TLS with the operating system trust store (the shipped configuration).
# Without it, rustls uses the bundled Mozilla roots; used for cross-compiled test builds
# where the Apple frameworks are unavailable at link time.
platform-tls = ["ureq/platform-verifier"]

[lints]
workspace = true

[dependencies]
observatory-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
ureq.workspace = true
jiff.workspace = true
sha2.workspace = true
uuid.workspace = true
plist.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.dist]
dist = false

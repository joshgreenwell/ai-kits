name: kit-board
on:
  push:
    paths: ['kit-board/**', '.github/workflows/kit-board.yml']
  pull_request:
    paths: ['kit-board/**', '.github/workflows/kit-board.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit-board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kit-board/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:collector
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run collectors:bundle
      - name: Generated assets are current
        run: git diff --exit-code -- lib/generated/report-ui.json lib/generated/collector-bundles.json
